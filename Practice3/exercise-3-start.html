<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        margin: 0;
        padding: 0;
        background: #eeeeee;
      }

      .container {
        width: 60%;
        margin: 2em auto;

        display: flex;
        flex-direction: column;
        gap: 1em;

        min-height: 80vh;
      }

      header {
        background: #1e90ff;
        color: white;
        padding: 1em;
        border-radius: 0.5em;
        box-shadow: 4px 4px #0077ea;
      }

      .content {
        display: flex;
        gap: 1em;

        flex-grow: 1;
      }

      main {
        background: #3cb371;
        padding: 1em;
        border-radius: 0.5em;
        box-shadow: 4px 4px #2f8d59;

        flex-grow: 1;

        display: flex;
        flex-wrap: wrap;
        gap: 1em;
        align-content: flex-start;
      }

      .item {
        width: 60px;
        height: 40px;

        background: #2f8d59;
        color: white;

        border-radius: 0.5em;
        box-shadow: 3px 3px #226741;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      aside {
        width: 80px;

        background: #ff6347;
        color: white;

        border-radius: 0.5em;
        box-shadow: 4px 4px #e02200;

        padding: 1em;
      }

      footer {
        background: #4169e1;
        color: white;

        padding: 1em;
        border-radius: 0.5em;
        box-shadow: 4px 4px #1d44b8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>header</header>

      <div class="content">
        <main>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>

          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>

          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
        </main>

        <aside>sidebar</aside>
      </div>

      <footer>footer</footer>
    </div>
  </body>
</html>
