<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="sidebar">
      <h2>MyApp</h2>

      <ul>
        <li><i class="fa-solid fa-house"></i> Home</li>
        <li><i class="fa-solid fa-user"></i> Users</li>
        <li><i class="fa-solid fa-box"></i> Products</li>
        <li><i class="fa-solid fa-chart-column"></i> Reports</li>
        <li><i class="fa-solid fa-gear"></i> Settings</li>
      </ul>
    </div>

    <div class="main">
      <div class="navbar">
        <h1>Dashboard</h1>
        <i class="fa-solid fa-bell"></i>
      </div>

      <div class="cards">
        <div class="card">
          <i class="fa-solid fa-users"></i>
          <h3>Customers</h3>
          <p>1,024</p>
        </div>

        <div class="card">
          <i class="fa-solid fa-cart-shopping"></i>
          <h3>Orders</h3>
          <p>356</p>
        </div>

        <div class="card">
          <i class="fa-solid fa-dollar-sign"></i>
          <h3>Revenue</h3>
          <p>$12,000</p>
        </div>

        <div class="card">
          <i class="fa-solid fa-chart-line"></i>
          <h3>Growth</h3>
          <p>85%</p>
        </div>
      </div>

      <!-- Recent Customer Orders -->

      <div class="messages">
        <h2>Recent Customer Orders</h2>

        <div class="message">
          <strong>Jonh Smith</strong>
          <p>Ordered 2 Iphones</p>
        </div>

        <div class="message">
          <strong>Seav Mey</strong>
          <p>Ordered a Dell Laptop</p>
        </div>

        <div class="message">
          <strong>Long Ny</strong>
          <p>Ordered 3 Smart Watches</p>
        </div>
      </div>
    </div>
  </body>
</html>
